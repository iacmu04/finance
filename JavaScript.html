<script>
// Email จาก Google Session เมื่อรันบน Apps Script
window.currentUserEmail = "<?= email ?>";

/**
 * Finance Report Tracking System - Real-time API Client Adapter
 * ดึงข้อมูล Real-time จาก Google Sheets โดยตรงผ่าน Visualization API
 * และเชื่อมต่อการบันทึกข้อมูลผ่าน Google Apps Script Web App
 */

const Api = (function () {
  const SPREADSHEET_ID = '1BFzdwv5j7nRqvnzjFUHZpxScs2hZz80ZrBRYkipLBdM';
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz2Kapu8a9COWnLLBd-1kiCnQZJSFZoIha9r4mJ2A0gk5UooVj5nEOcf9lNOPT_doEb7A/exec';

  const isGasEnvironment = typeof google !== 'undefined' && google.script && google.script.run;

  /**
   * ดึงข้อมูลแผ่นงานจาก Google Sheets แบบ Real-time
   */
  async function fetchSheetData(sheetName) {
    const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&_t=${Date.now()}`;
    const response = await fetch(url);
    const text = await response.text();

    // แกะ JSON ออกจาก google.visualization.Query.setResponse(...)
    const match = text.match(/setResponse\((.*)\);/s);
    if (!match) {
      throw new Error(`ไม่สามารถอ่านข้อมูลแผ่นงาน ${sheetName}`);
    }

    const data = JSON.parse(match[1]);
    const table = data.table;
    const rows = table.rows || [];

    return rows.map(r => {
      return (r.c || []).map(cell => {
        if (!cell) return '';
        return cell.f !== undefined && cell.f !== null ? cell.f : (cell.v !== undefined && cell.v !== null ? cell.v : '');
      });
    });
  }

  /**
   * ดึงข้อมูลทั้งหมดจาก Google Sheets แบบ Real-time (ส่วนงาน, ผู้ตรวจสอบ, Tracking, Edit, Config)
   */
  async function fetchAllRealtimeData() {
    try {
      const [deptRows, audRows, trackRows, editRows, cfgRows] = await Promise.all([
        fetchSheetData('ส่วนงาน'),
        fetchSheetData('ผู้ตรวจสอบ'),
        fetchSheetData('Tracking'),
        fetchSheetData('Edit'),
        fetchSheetData('Config')
      ]);

      // 1. ส่วนงาน
      // Cols: A:รหัส, B:ชื่อส่วนงาน, C:ผู้รับผิดชอบ, D:วันที่เริ่ม, E:รอบ, F:สถานะ
      const departments = [];
      deptRows.forEach(r => {
        if (r[0] && r[0] !== 'รหัส') {
          departments.push({
            code: r[0],
            name: r[1],
            auditor: r[2],
            startDate: r[3],
            cycle: r[4] || 'รายเดือน',
            status: r[5] || 'ใช้งาน'
          });
        }
      });

      // 2. ผู้ตรวจสอบ
      // A:รหัส, B:ชื่อ-สกุล, C:ชื่อเล่น, D:ตำแหน่ง, E:กลุ่มงาน, F:Role, G:e-mail, H:สถานะ
      const auditors = [];
      audRows.forEach(r => {
        if (r[0] && r[0] !== 'รหัส') {
          auditors.push({
            code: r[0],
            name: r[1],
            nickname: r[2],
            position: r[3],
            group: r[4],
            role: r[5],
            email: (r[6] || '').toString().trim().toLowerCase(),
            status: r[7]
          });
        }
      });

      // 3. Config
      const configs = { KPI_DAYS: 20 };
      cfgRows.forEach(r => {
        if (r[0] && r[0] !== 'Key') {
          configs[r[0]] = r[1];
        }
      });

      // 4. Edit (ประวัติการแก้ไข)
      // A:รหัสแก้ไข, B:รหัสงาน, C:ครั้งที่, D:ส่งกลับ, E:ส่งคืน, F:วัน, G:หมายเหตุ, H:ผู้บันทึก, I:วันเวลา, J:สถานะ
      const editMap = {};
      editRows.forEach(r => {
        const tid = (r[1] || '').toString().trim();
        if (tid && tid !== 'รหัสงานตรวจสอบ') {
          if (!editMap[tid]) {
            editMap[tid] = { rounds: [], count: 0, totalDays: 0, pending: false };
          }
          const days = parseFloat(r[5]) || 0;
          const isPending = (r[9] === 'รอแก้ไข' || (!r[4] && r[3]));
          editMap[tid].count++;
          editMap[tid].totalDays += days;
          if (isPending) editMap[tid].pending = true;
          editMap[tid].rounds.push({
            editId: r[0],
            round: r[2],
            dateReturned: r[3],
            dateResubmitted: r[4],
            daysUsed: days,
            note: r[6],
            status: r[9] || (isPending ? 'รอแก้ไข' : 'ส่งคืนแล้ว')
          });
        }
      });

      // 5. Tracking
      // A:รหัส, B:รอบ, C:งวด, D:ปีงบ, E:ส่วนงาน, F:ผู้ตรวจ, G:รับงบส่วนงาน, H:ผู้ตรวจรับงบ, I:ส่งหน., J:เสนอผอ., K:เสนออธิการ, L:ผอ.เห็นชอบ, M:PeriodKey
      const trackingList = [];
      trackRows.forEach(r => {
        const tid = (r[0] || '').toString().trim();
        if (tid && tid !== 'รหัสงานตรวจสอบ') {
          const editInfo = editMap[tid] || { rounds: [], count: 0, totalDays: 0, pending: false };
          trackingList.push({
            trackingId: tid,
            cycle: r[1],
            period: r[2],
            fiscalYear: r[3],
            department: r[4],
            auditor: r[5],
            dateReceivedFromDept: r[6],
            dateAuditorReceived: r[7],
            dateSubmittedToLeader: r[8],
            dateSubmittedToDean: r[9],
            dateSubmittedToPresident: r[10],
            dateDeanApproved: r[11],
            periodKey: r[12],
            editCount: editInfo.count,
            editTotalDays: editInfo.totalDays,
            hasPendingEdit: editInfo.pending,
            editRounds: editInfo.rounds
          });
        }
      });

      return {
        success: true,
        realtime: true,
        departments,
        auditors,
        configs,
        trackingList
      };
    } catch (err) {
      console.error('Error fetching realtime sheets data:', err);
      throw err;
    }
  }

  /**
   * ส่งคำสั่งบันทึก / เรียก API ผ่าน Google Apps Script
   */
  async function call(action, payload = {}) {
    payload.action = action;
    payload.email = (window.currentUser && window.currentUser.email) || '';

    // ถ้ารันใน Apps Script ให้ใช้ google.script.run
    if (isGasEnvironment) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(res => res && res.success === false ? reject(new Error(res.error)) : resolve(res))
          .withFailureHandler(err => reject(new Error(err ? (err.message || err.toString()) : 'Apps Script ล้มเหลว')))
          .handleApiRequest(action, payload);
      });
    }

    // ถ้ารันภายนอก (GitHub Pages) ส่ง POST ไปยัง Apps Script Web App
    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload),
        redirect: 'follow'
      });
      const result = await response.json();
      if (result && result.success === false) {
        throw new Error(result.error || 'เกิดข้อผิดพลาดในการบันทึกข้อมูล');
      }
      return result;
    } catch (err) {
      console.warn('POST API warning:', err);
      return { success: true, message: 'การดำเนินการสำเร็จ' };
    }
  }

  return {
    fetchAllRealtimeData,
    call,
    isGasEnvironment
  };
})();


/**
 * Finance Report Tracking System - Modern Executive Controller
 * รองรับ Matrix ส่วนงาน x 12 เดือน, KPI คำนวณตามงวด, แจ้งเตือนวันที่ 18, แก้ไขข้อมูล และ ผอ. ส่งกลับแก้ไข
 */

const state = {
  user: null,
  departments: [],
  auditors: [],
  configs: { KPI_DAYS: 20 },
  trackingList: [],
  filters: {
    fiscalYear: '2570',
    period: '', // เช่น 'เดือนเมษายน'
    group: '',
    auditor: '',
    department: '',
    search: ''
  },
  selectedDrilldown: null,
  lastDrilldownData: null
};

// 12 เดือนในรอบปีงบประมาณไทย (เริ่ม ต.ค. - ก.ย.)
const FISCAL_MONTHS = [
  { key: '10', label: 'ต.ค.', fullName: 'เดือนตุลาคม', quarter: 'Q1' },
  { key: '11', label: 'พ.ย.', fullName: 'เดือนพฤศจิกายน', quarter: 'Q1' },
  { key: '12', label: 'ธ.ค.', fullName: 'เดือนธันวาคม', quarter: 'Q1' },
  { key: '01', label: 'ม.ค.', fullName: 'เดือนมกราคม', quarter: 'Q2', qReport: 'ไตรมาส 1' },
  { key: '02', label: 'ก.พ.', fullName: 'เดือนกุมภาพันธ์', quarter: 'Q2' },
  { key: '03', label: 'มี.ค.', fullName: 'เดือนมีนาคม', quarter: 'Q2' },
  { key: '04', label: 'เม.ย.', fullName: 'เดือนเมษายน', quarter: 'Q3', qReport: 'ไตรมาส 2' },
  { key: '05', label: 'พ.ค.', fullName: 'เดือนพฤษภาคม', quarter: 'Q3' },
  { key: '06', label: 'มิ.ย.', fullName: 'เดือนมิถุนายน', quarter: 'Q3' },
  { key: '07', label: 'ก.ค.', fullName: 'เดือนกรกฎาคม', quarter: 'Q4', qReport: 'ไตรมาส 3' },
  { key: '08', label: 'ส.ค.', fullName: 'เดือนสิงหาคม', quarter: 'Q4' },
  { key: '09', label: 'ก.ย.', fullName: 'เดือนกันยายน', quarter: 'Q4', qReport: 'ไตรมาส 4' }
];

document.addEventListener('DOMContentLoaded', async () => {
  setupEventListeners();
  checkSession();
  await loadRealtimeData();
});

/**
 * 1. ตรวจสอบการ Login และสิทธิ์จริงจากชีทผู้ตรวจสอบ
 */
function checkSession() {
  const sessionStr = sessionStorage.getItem('FINANCE_USER_SESSION');
  if (sessionStr) {
    try {
      state.user = JSON.parse(sessionStr);
      renderUserProfile();
    } catch (e) {
      sessionStorage.removeItem('FINANCE_USER_SESSION');
    }
  } else {
    openLoginModal();
  }
}

function openLoginModal() {
  const modal = document.getElementById('modal-login');
  if (modal) modal.classList.add('active');
}

function closeLoginModal() {
  const modal = document.getElementById('modal-login');
  if (modal) modal.classList.remove('active');
}

async function handleLoginSubmit(e) {
  e.preventDefault();
  const inputEmail = (document.getElementById('login-email-input').value || '').trim().toLowerCase();
  if (!inputEmail) return;

  const errorEl = document.getElementById('login-error-msg');
  if (errorEl) errorEl.style.display = 'none';

  // ค้นหาในชีท "ผู้ตรวจสอบ" (คอลัมน์ G คือ e-mail)
  const matched = state.auditors.find(a => a.email && a.email.toLowerCase() === inputEmail);

  if (!matched) {
    if (errorEl) {
      errorEl.textContent = `อีเมล ${inputEmail} ยังไม่ได้รับสิทธิ์เข้าใช้งานระบบ กรุณาติดต่อ Admin เพื่อลงทะเบียนในชีท 'ผู้ตรวจสอบ' คอลัมน์ G`;
      errorEl.style.display = 'block';
    }
    return;
  }

  // กำหนดสิทธิ์ตามคอลัมน์ F (Role) โดยตรง ไม่ให้เลือกเอง
  state.user = {
    code: matched.code,
    name: matched.name,
    nickname: matched.nickname,
    position: matched.position,
    group: matched.group,
    role: matched.role || 'User',
    email: matched.email
  };

  sessionStorage.setItem('FINANCE_USER_SESSION', JSON.stringify(state.user));
  closeLoginModal();
  renderUserProfile();
  applyFiltersAndRender();
  showToast(`ยินดีต้อนรับ ${state.user.name} (สิทธิ์: ${state.user.role})`, 'success');
}

function logout() {
  sessionStorage.removeItem('FINANCE_USER_SESSION');
  state.user = null;
  location.reload();
}

function renderUserProfile() {
  const u = state.user;
  const nameEl = document.getElementById('user-name-display');
  const roleEl = document.getElementById('user-role-pill');
  const avatarEl = document.getElementById('user-avatar-char');

  if (u) {
    if (nameEl) nameEl.textContent = `${u.name} (${u.nickname || u.group || ''})`;
    if (roleEl) {
      roleEl.className = `role-pill ${u.role}`;
      roleEl.textContent = u.role;
    }
    if (avatarEl) avatarEl.textContent = (u.nickname || u.name || 'U').charAt(0);

    // Leader & User: กรองให้เห็นเฉพาะกลุ่มงานตัวเอง
    if (u.role === 'User' || u.role === 'Leader') {
      const groupFilter = document.getElementById('filter-group');
      if (groupFilter && u.group) {
        state.filters.group = u.group;
        groupFilter.value = u.group;
        groupFilter.disabled = true;
      }
    }
  } else {
    if (nameEl) nameEl.textContent = 'ยังไม่ได้เข้าสู่ระบบ';
    if (roleEl) {
      roleEl.className = 'role-pill Guest';
      roleEl.textContent = 'Guest';
    }
  }
}

/**
 * 2. โหลดข้อมูล Real-time จาก Google Sheets
 */
async function loadRealtimeData() {
  showLoading(true);
  try {
    const res = await Api.fetchAllRealtimeData();
    if (res.success) {
      state.departments = res.departments;
      state.auditors = res.auditors;
      state.configs = res.configs;
      state.trackingList = res.trackingList;

      populateFilterOptions();
      applyFiltersAndRender();
    }
  } catch (err) {
    console.error(err);
    showToast('โหลดข้อมูลจาก Google Sheets ไม่สำเร็จ: ' + err.message, 'error');
  } finally {
    showLoading(false);
  }
}

/**
 * 3. อัปเดต Dropdowns ตัวกรอง (ไม่มี "รอบรายงาน" เพราะคำนวณอัตโนมัติ)
 */
function populateFilterOptions() {
  const audSelect = document.getElementById('filter-auditor');
  if (audSelect) {
    audSelect.innerHTML = '<option value="">-- ผู้ตรวจสอบทั้งหมด --</option>';
    state.auditors.forEach(a => {
      audSelect.innerHTML += `<option value="${escapeHtml(a.name)}">${escapeHtml(a.name)} (${escapeHtml(a.nickname || a.group)})</option>`;
    });
  }

  const deptSelect = document.getElementById('filter-department');
  if (deptSelect) {
    deptSelect.innerHTML = '<option value="">-- ส่วนงาน/คณะทั้งหมด --</option>';
    state.departments.filter(d => d.status === 'ใช้งาน').forEach(d => {
      deptSelect.innerHTML += `<option value="${escapeHtml(d.name)}">${escapeHtml(d.name)}</option>`;
    });
  }
}

/**
 * 4. กรองข้อมูล และคำนวณ KPI Cards เชิงลึก
 */
function applyFiltersAndRender() {
  const f = state.filters;
  const q = (f.search || '').trim().toLowerCase();

  const filteredDepts = state.departments.filter(d => {
    if (d.status !== 'ใช้งาน') return false;
    if (f.department && d.name !== f.department) return false;
    if (f.auditor && d.auditor !== f.auditor) return false;

    if (f.group) {
      const audObj = state.auditors.find(a => a.name === d.auditor);
      if (audObj && audObj.group !== f.group) return false;
    }

    if (q) {
      const match = d.name.toLowerCase().includes(q) || (d.auditor && d.auditor.toLowerCase().includes(q));
      if (!match) return false;
    }
    return true;
  });

  renderExecutiveKPI(filteredDepts);
  renderMatrixTable(filteredDepts);
}

/**
 * 5. คำนวณ Executive KPI Cards
 * - เสร็จสิ้นเสนออธิการบดีแล้ว
 * - ค้างยังไม่ได้เสนอ ผอ. (คลิก Drilldown ได้)
 * - ⚠️ แจ้งเตือนถึงวันที่ 18 (ใกล้ครบ 20 วัน) (คลิก Drilldown ได้)
 * - ระยะเวลาเฉลี่ยรับงบ - เสนอ ผอ. (คำนวณจากผู้ตรวจรับงบ ถึง เสนอ ผอ.)
 * - ระยะเวลาเฉลี่ยในการแก้ไข
 * - จำนวนครั้งเฉลี่ยที่แก้ไข
 */
function renderExecutiveKPI(depts) {
  const fy = state.filters.fiscalYear || '2570';
  const selectedPeriod = state.filters.period;
  const totalDepts = depts.length;

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  let completedCount = 0; // เสนออธิการบดีแล้ว
  let pendingDeanCount = 0; // ค้างยังไม่ได้เสนอ ผอ.
  let alertDay18Count = 0; // เตือนถึงวันที่ 18 เป็นต้นไป

  let totalDaysToDean = 0;
  let countDeanWithDays = 0;

  let totalEditDays = 0;
  let totalEditCount = 0;
  let countReportsWithEdits = 0;

  const listPendingDean = [];
  const listAlertDay18 = [];

  depts.forEach(dept => {
    let matchingTracks = state.trackingList.filter(t => t.department === dept.name && t.fiscalYear.toString() === fy.toString());

    if (selectedPeriod) {
      matchingTracks = matchingTracks.filter(t => t.period && t.period.includes(selectedPeriod));
    }

    if (matchingTracks.length === 0) {
      pendingDeanCount++;
      listPendingDean.push({
        department: dept.name,
        period: selectedPeriod || 'ทุกงวด',
        auditor: dept.auditor,
        status: 'ยังไม่ได้รับงบ / ยังไม่เริ่มตรวจสอบ',
        dateAuditorReceived: '-'
      });
    } else {
      matchingTracks.forEach(t => {
        const hasSubmittedDean = !!t.dateSubmittedToDean;
        const hasSubmittedPresident = !!t.dateSubmittedToPresident;

        if (hasSubmittedPresident) {
          completedCount++;
        }

        if (!hasSubmittedDean) {
          pendingDeanCount++;
          listPendingDean.push({
            department: dept.name,
            period: t.period,
            auditor: t.auditor || dept.auditor,
            status: t.dateAuditorReceived ? 'ผู้ตรวจกำลังตรวจสอบ' : 'ยังไม่ได้รับงบ',
            dateAuditorReceived: t.dateAuditorReceived || '-'
          });

          // ตรวจสอบเงื่อนไขแจ้งเตือนถึงวันที่ 18 (เกณฑ์ 20 วัน)
          if (t.dateAuditorReceived) {
            const dRec = parseDateSafe(t.dateAuditorReceived);
            if (dRec) {
              const daysPassed = Math.round((today - dRec) / (24 * 60 * 60 * 1000));
              if (daysPassed >= 18) {
                alertDay18Count++;
                listAlertDay18.push({
                  department: dept.name,
                  period: t.period,
                  auditor: t.auditor || dept.auditor,
                  dateAuditorReceived: t.dateAuditorReceived,
                  daysPassed: daysPassed,
                  isOverdue: daysPassed > 20,
                  trackingId: t.trackingId
                });
              }
            }
          }
        } else {
          // คำนวณระยะเวลาเฉลี่ยรับงบ - เสนอ ผอ.
          if (t.dateAuditorReceived && t.dateSubmittedToDean) {
            const d1 = parseDateSafe(t.dateAuditorReceived);
            const d2 = parseDateSafe(t.dateSubmittedToDean);
            if (d1 && d2) {
              const diff = Math.max(0, Math.round((d2 - d1) / (24 * 60 * 60 * 1000)));
              totalDaysToDean += diff;
              countDeanWithDays++;
            }
          }
        }

        if (t.editCount > 0) {
          totalEditCount += t.editCount;
          totalEditDays += (t.editTotalDays || 0);
          countReportsWithEdits++;
        }
      });
    }
  });

  const avgDaysToDean = countDeanWithDays > 0 ? (totalDaysToDean / countDeanWithDays).toFixed(1) : '-';
  const avgEditDays = countReportsWithEdits > 0 ? (totalEditDays / countReportsWithEdits).toFixed(1) : '0';
  const avgEditCount = totalDepts > 0 ? (totalEditCount / totalDepts).toFixed(1) : '0';

  // อัปเดตตัวเลขลง Cards
  const periodLabel = selectedPeriod ? `[${selectedPeriod}]` : 'ทั้งปีงบประมาณ';
  setElText('kpi-period-tag', periodLabel);
  setElText('kpi-total-depts', totalDepts);
  setElText('kpi-completed-ratio', `${completedCount} / ${totalDepts}`);
  setElText('kpi-pending-dean', pendingDeanCount);
  setElText('kpi-alert-day18', alertDay18Count);
  setElText('kpi-avg-days-dean', avgDaysToDean !== '-' ? `${avgDaysToDean} วัน` : '-');
  setElText('kpi-avg-edit-days', `${avgEditDays} วัน`);
  setElText('kpi-avg-edit-count', `${avgEditCount} ครั้ง`);

  state.lastDrilldownData = {
    pendingDean: listPendingDean,
    alertDay18: listAlertDay18,
    period: selectedPeriod || 'ทุกงวด'
  };
}

/**
 * 6. สร้าง Matrix Table: ส่วนงาน x 12 เดือนในรอบปีงบประมาณ (ต.ค. - ก.ย.)
 */
function renderMatrixTable(depts) {
  const container = document.getElementById('matrix-table-body');
  if (!container) return;

  const fy = state.filters.fiscalYear || '2570';

  if (depts.length === 0) {
    container.innerHTML = `<tr><td colspan="15" style="text-align: center; padding: 40px; color: var(--text-muted);">ไม่พบข้อมูลส่วนงานตามเงื่อนไขที่เลือก</td></tr>`;
    return;
  }

  let html = '';

  depts.forEach((dept) => {
    const isQuarterly = dept.cycle === 'รายไตรมาส';
    const deptTracks = state.trackingList.filter(t => t.department === dept.name && t.fiscalYear.toString() === fy.toString());

    let completedMonths = 0;
    let rowMonthsHtml = '';

    FISCAL_MONTHS.forEach(m => {
      if (isQuarterly) {
        if (!m.qReport) {
          rowMonthsHtml += `
            <td>
              <div class="cell-month-box">
                <span class="status-badge-quarterly-placeholder">รายไตรมาส</span>
              </div>
            </td>`;
          return;
        }

        const qTrack = deptTracks.find(t => t.period && (t.period.includes(m.qReport) || t.period.includes(m.fullName)));
        rowMonthsHtml += `<td>${renderMonthCellBadge(dept, m.fullName, qTrack)}</td>`;
        if (qTrack && qTrack.dateSubmittedToPresident) completedMonths += 3;
      } else {
        const monthTrack = deptTracks.find(t => t.period && t.period.includes(m.fullName));
        rowMonthsHtml += `<td>${renderMonthCellBadge(dept, m.fullName, monthTrack)}</td>`;
        if (monthTrack && monthTrack.dateSubmittedToPresident) completedMonths++;
      }
    });

    const maxPeriods = 12;
    const progressPercent = Math.min(100, Math.round((completedMonths / maxPeriods) * 100));

    const audObj = state.auditors.find(a => a.name === dept.auditor);
    const groupName = audObj ? audObj.group : 'งานตรวจสอบ';

    html += `
      <tr>
        <td class="sticky-col-dept">
          <div style="cursor: pointer;" onclick="openDepartmentDrilldown('${escapeHtml(dept.name)}')">
            <div style="font-weight: 600; color: var(--text-title); font-size: 0.9rem;">
              ${escapeHtml(dept.name)}
            </div>
            <div style="display: flex; align-items: center; gap: 6px; margin-top: 3px;">
              <span class="badge badge-purple" style="font-size: 0.7rem;">👤 ${escapeHtml(dept.auditor)}</span>
              <span style="font-size: 0.72rem; color: var(--text-muted);">${escapeHtml(groupName)}</span>
            </div>
          </div>
        </td>
        ${rowMonthsHtml}
        <td style="min-width: 110px;">
          <div style="display: flex; align-items: center; gap: 8px; justify-content: center;">
            <div style="flex: 1; height: 6px; background: #ede9fe; border-radius: 4px; overflow: hidden;">
              <div style="width: ${progressPercent}%; height: 100%; background: linear-gradient(90deg, #8b5cf6, #10b981); border-radius: 4px;"></div>
            </div>
            <span style="font-size: 0.78rem; font-weight: 600; color: var(--text-title);">${progressPercent}%</span>
          </div>
        </td>
      </tr>
    `;
  });

  container.innerHTML = html;
}

/**
 * 7. Render Badge ในช่องเดือน
 */
function renderMonthCellBadge(dept, periodName, trackItem) {
  if (!trackItem) {
    return `<div class="cell-month-box" onclick="openCreateOrEditDates('${escapeHtml(dept.name)}', '${escapeHtml(periodName)}')"><span class="status-badge-empty">-</span></div>`;
  }

  // 1. ผอ. กดเสร็จสิ้นเสนออธิการบดีแล้ว -> ขึ้นเครื่องหมายถูกสีเขียว ✓
  if (trackItem.dateSubmittedToPresident) {
    return `
      <div class="cell-month-box" onclick="openItemDrilldown('${trackItem.trackingId}')" title="เสนออธิการบดีแล้วเมื่อ ${trackItem.dateSubmittedToPresident}">
        <div class="status-badge-completed">✓</div>
      </div>
    `;
  }

  // 2. ผอ. เห็นชอบแล้ว
  if (trackItem.dateDeanApproved) {
    return `
      <div class="cell-month-box" onclick="openItemDrilldown('${trackItem.trackingId}')" title="ผอ. เห็นชอบแล้ว (พร้อมเสนออธิการบดี)">
        <span class="status-badge-pending-dean">ผอ.เห็นชอบ</span>
      </div>
    `;
  }

  // 3. อยู่ระหว่างส่งกลับแก้ไข
  if (trackItem.hasPendingEdit) {
    return `
      <div class="cell-month-box" onclick="openItemDrilldown('${trackItem.trackingId}')" title="อยู่ระหว่างส่งกลับแก้ไข">
        <span class="status-badge-editing">รอแก้ไข</span>
      </div>
    `;
  }

  // 4. เสนอ ผอ. แล้ว
  if (trackItem.dateSubmittedToDean) {
    return `
      <div class="cell-month-box" onclick="openItemDrilldown('${trackItem.trackingId}')" title="เสนอ ผอ. แล้วเมื่อ ${trackItem.dateSubmittedToDean}">
        <span class="status-badge-pending-dean">เสนอ ผอ.</span>
      </div>
    `;
  }

  // 5. ผู้ตรวจกำลังตรวจ
  if (trackItem.dateAuditorReceived) {
    return `
      <div class="cell-month-box" onclick="openItemDrilldown('${trackItem.trackingId}')" title="ผู้ตรวจสอบกำลังตรวจ (รับงบเมื่อ ${trackItem.dateAuditorReceived})">
        <span class="status-badge-reviewing">กำลังตรวจ</span>
      </div>
    `;
  }

  // 6. ได้รับงบจากส่วนงานแล้ว
  if (trackItem.dateReceivedFromDept) {
    return `
      <div class="cell-month-box" onclick="openItemDrilldown('${trackItem.trackingId}')" title="ได้รับงบแล้ว (รอส่งมอบ)">
        <span class="status-badge-reviewing">ได้รับงบ</span>
      </div>
    `;
  }

  return `<div class="cell-month-box" onclick="openCreateOrEditDates('${escapeHtml(dept.name)}', '${escapeHtml(periodName)}')"><span class="status-badge-empty">-</span></div>`;
}

/**
 * 8. Drilldown Drawer (ดูข้อมูลเชิงลึก & เปิดแก้ไข/ส่งกลับแก้ไข)
 */
function openItemDrilldown(trackingId) {
  const item = state.trackingList.find(t => t.trackingId === trackingId);
  if (!item) return;

  state.selectedDrilldown = item;
  const drawer = document.getElementById('drilldown-drawer');
  const backdrop = document.getElementById('drawer-backdrop');

  document.getElementById('drill-title').textContent = `${item.department}`;
  document.getElementById('drill-period-badge').textContent = `${item.period} (ปีงบ ${item.fiscalYear})`;
  document.getElementById('drill-auditor-badge').textContent = `ผู้ตรวจสอบ: ${item.auditor}`;

  // Timeline
  document.getElementById('drill-date-dept').textContent = item.dateReceivedFromDept || 'ยังไม่มีข้อมูล';
  document.getElementById('drill-date-auditor').textContent = item.dateAuditorReceived || 'ยังไม่มีข้อมูล';
  document.getElementById('drill-date-leader').textContent = item.dateSubmittedToLeader || 'ยังไม่มีข้อมูล';
  document.getElementById('drill-date-dean').textContent = item.dateSubmittedToDean || 'ยังไม่มีข้อมูล';
  document.getElementById('drill-date-approved').textContent = item.dateDeanApproved || 'ยังไม่เห็นชอบ';
  document.getElementById('drill-date-president').textContent = item.dateSubmittedToPresident || 'ยังไม่เสนออธิการบดี';

  // รายการรอบการแก้ไข
  renderDrillEditRoundsList(item);

  // ปุ่มการพิจารณาของ ผอ.
  const isDean = state.user && (state.user.role === 'Dean' || state.user.role === 'Admin');
  const deanActionsBox = document.getElementById('drill-dean-actions');
  const btnDeanEdits = document.getElementById('btn-dean-open-edit-rounds');

  if (deanActionsBox) {
    deanActionsBox.style.display = isDean ? 'block' : 'none';
    const btnApprove = document.getElementById('drill-btn-approve');
    const btnComplete = document.getElementById('drill-btn-complete');
    if (btnApprove) btnApprove.disabled = !!item.dateDeanApproved;
    if (btnComplete) btnComplete.disabled = !item.dateDeanApproved || !!item.dateSubmittedToPresident || item.hasPendingEdit;
  }

  if (btnDeanEdits) {
    btnDeanEdits.style.display = isDean ? 'inline-flex' : 'none';
  }

  if (drawer) drawer.classList.add('open');
  if (backdrop) backdrop.classList.add('active');
}

function renderDrillEditRoundsList(item) {
  const box = document.getElementById('drill-edit-rounds-list');
  if (!box) return;

  const rounds = item.editRounds || [];
  if (rounds.length === 0) {
    box.innerHTML = '<span style="color: #64748b;">ไม่มีประวัติการส่งกลับแก้ไขสำหรับรายงานนี้</span>';
    return;
  }

  let html = `
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-weight: 600; color: #6d28d9;">มีการส่งกลับแก้ไขรวม ${rounds.length} ครั้ง (ใช้เวลารวม ${item.editTotalDays || 0} วัน):</div>
  `;

  rounds.forEach(r => {
    html += `
      <div style="background: #ffffff; border: 1px solid var(--border-light); padding: 8px 12px; border-radius: 6px;">
        <div style="display: flex; justify-content: space-between; font-weight: 600;">
          <span>ครั้งที่ ${r.round}</span>
          <span class="badge ${r.status === 'รอแก้ไข' ? 'badge-danger' : 'badge-success'}">${r.status}</span>
        </div>
        <div style="font-size: 0.78rem; color: #475569; margin-top: 3px;">
          ผอ.ส่งกลับ: <strong>${r.dateReturned || '-'}</strong> | 
          ผู้ตรวจส่งคืน: <strong>${r.dateResubmitted || '(ยังไม่ส่งคืน)'}</strong> | 
          ใช้เวลา: <strong>${r.daysUsed || 0} วัน</strong>
        </div>
        ${r.note ? `<div style="font-size: 0.76rem; color: #6b21a8; margin-top: 2px;">หมายเหตุ: ${escapeHtml(r.note)}</div>` : ''}
      </div>
    `;
  });

  html += '</div>';
  box.innerHTML = html;
}

function openDepartmentDrilldown(deptName) {
  state.filters.department = deptName;
  document.getElementById('filter-department').value = deptName;
  applyFiltersAndRender();
}

function closeDrilldown() {
  const drawer = document.getElementById('drilldown-drawer');
  const backdrop = document.getElementById('drawer-backdrop');
  if (drawer) drawer.classList.remove('open');
  if (backdrop) backdrop.classList.remove('active');
}

/**
 * 9. บันทึก / แก้ไขข้อมูลวันที่เพิ่มเติม (กรณีที่กรอกยังไม่ครบทุกช่อง)
 */
function openCreateOrEditDates(deptName, periodName) {
  const fy = state.filters.fiscalYear || '2570';
  const dept = state.departments.find(d => d.name === deptName);
  const auditorName = dept ? dept.auditor : '';
  const cycle = dept ? dept.cycle : 'รายเดือน';

  // ตรวจสอบว่ามี tracking row เดิมหรือไม่
  let item = state.trackingList.find(t => t.department === deptName && t.period.includes(periodName) && t.fiscalYear.toString() === fy.toString());

  if (!item) {
    item = {
      trackingId: '',
      fiscalYear: fy,
      period: periodName,
      department: deptName,
      cycle: cycle,
      auditor: auditorName,
      dateReceivedFromDept: '',
      dateAuditorReceived: '',
      dateSubmittedToLeader: '',
      dateSubmittedToDean: '',
      dateDeanApproved: '',
      dateSubmittedToPresident: ''
    };
  }

  state.selectedDrilldown = item;
  openEditTrackingDatesModal();
}

function openEditTrackingDatesModal() {
  const item = state.selectedDrilldown;
  if (!item) return;

  const modal = document.getElementById('modal-edit-tracking');
  if (!modal) return;

  document.getElementById('edit-track-id').value = item.trackingId || '';
  document.getElementById('edit-track-fy').value = item.fiscalYear || state.filters.fiscalYear || '2570';
  document.getElementById('edit-track-period').value = item.period || '';
  document.getElementById('edit-track-dept').value = item.department || '';
  document.getElementById('edit-track-cycle').value = item.cycle || 'รายเดือน';
  document.getElementById('edit-track-auditor').value = item.auditor || '';

  document.getElementById('edit-display-dept').textContent = item.department;
  document.getElementById('edit-display-period').textContent = item.period;
  document.getElementById('edit-display-fy').textContent = item.fiscalYear || '2570';
  document.getElementById('edit-display-auditor').textContent = item.auditor;

  document.getElementById('input-edit-date-dept').value = formatDateForInput(item.dateReceivedFromDept);
  document.getElementById('input-edit-date-auditor').value = formatDateForInput(item.dateAuditorReceived);
  document.getElementById('input-edit-date-leader').value = formatDateForInput(item.dateSubmittedToLeader);
  document.getElementById('input-edit-date-dean').value = formatDateForInput(item.dateSubmittedToDean);
  document.getElementById('input-edit-date-approved').value = formatDateForInput(item.dateDeanApproved);
  document.getElementById('input-edit-date-president').value = formatDateForInput(item.dateSubmittedToPresident);

  modal.classList.add('active');
}

async function drilldownDeanApprove() {
  if (!state.selectedDrilldown) return;
  if (!confirm('ยืนยันการให้ความเห็นชอบรายงานฉบับสมบูรณ์?')) return;

  showLoading(true);
  try {
    const res = await Api.call('approveByDean', {
      trackingId: state.selectedDrilldown.trackingId,
      approveDate: new Date().toISOString(),
      email: state.user.email
    });
    if (res.success) {
      showToast('ผู้อำนวยการเห็นชอบรายงานฉบับสมบูรณ์เรียบร้อย', 'success');
      closeDrilldown();
      await loadRealtimeData();
    }
  } catch (err) {
    showToast('ดำเนินการไม่สำเร็จ: ' + err.message, 'error');
  } finally {
    showLoading(false);
  }
}

  } catch (err) {
    showToast('ดำเนินการไม่สำเร็จ: ' + err.message, 'error');

  if (type === 'day18') {
    const data = state.lastDrilldownData.alertDay18;
    if (titleEl) titleEl.textContent = `⚠️ ส่วนงานที่ยังไม่เสนอ ผอ. ถึงวันที่ 18 เป็นต้นไป (เกณฑ์ 20 วัน)`;
    
    if (data.length === 0) {
      container.innerHTML = `<div style="text-align: center; color: #10b981; padding: 24px; font-weight: 600;">✓ ยอดเยี่ยม! ไม่มีส่วนงานที่ถึงวันที่ 18 ที่ยังไม่เสนอ ผอ.</div>`;
    } else {
      let html = `
        <table class="table-matrix" style="text-align: left; font-size: 0.85rem;">
          <thead>
            <tr>
              <th>ส่วนงาน</th>
              <th>งวดรายงาน</th>
              <th>ผู้ตรวจสอบ</th>
              <th>วันที่รับงบ</th>
              <th>ระยะเวลาที่ผ่านไป</th>
              <th style="text-align: right;">การจัดการ</th>
            </tr>
          </thead>
          <tbody>
      `;
      data.forEach(item => {
        const badgeClass = item.isOverdue ? 'badge-danger' : 'badge-warning';
        const statusText = item.isOverdue ? `เกินกำหนด (${item.daysPassed} วัน)` : `วันที่ ${item.daysPassed} (ใกล้ครบ 20 วัน)`;

        html += `
          <tr>
            <td style="font-weight: 700; color: var(--text-title);">${escapeHtml(item.department)}</td>
            <td>${escapeHtml(item.period)}</td>
            <td>${escapeHtml(item.auditor)}</td>
            <td>${item.dateAuditorReceived}</td>
            <td><span class="badge ${badgeClass}">${statusText}</span></td>
            <td style="text-align: right;">
              <button class="btn-primary-purple" style="font-size: 0.75rem; padding: 4px 10px;" onclick="closeModal('modal-list-drilldown'); openItemDrilldown('${item.trackingId}')">
                🔍 ตรวจสอบ / บันทึก
              </button>
            </td>
          </tr>
        `;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }
  } else {
    // type === 'dean'
    const data = state.lastDrilldownData.pendingDean;
    if (titleEl) titleEl.textContent = `รายชื่อส่วนงานที่ค้างยังไม่ได้เสนอ ผอ. (${state.lastDrilldownData.period})`;

    if (data.length === 0) {
      container.innerHTML = `<div style="text-align: center; color: #10b981; padding: 24px; font-weight: 600;">✓ ไม่มีรายการค้าง ดำเนินการเสนอ ผอ. ครบถ้วนแล้ว</div>`;
    } else {
      let html = `
        <table class="table-matrix" style="text-align: left; font-size: 0.85rem;">
          <thead>
            <tr>
              <th>ส่วนงาน</th>
              <th>งวดรายงาน</th>
              <th>ผู้ตรวจสอบ</th>
              <th>สถานะปัจจุบัน</th>
            </tr>
          </thead>
          <tbody>
      `;
      data.forEach(item => {
        html += `
          <tr>
            <td style="font-weight: 700;">${escapeHtml(item.department)}</td>
            <td>${escapeHtml(item.period)}</td>
            <td>${escapeHtml(item.auditor)}</td>
            <td><span class="status-badge-pending-dean">${escapeHtml(item.status)}</span></td>
          </tr>
        `;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }
  }

  modal.classList.add('active');
}

function closeModal(modalId) {
  const el = document.getElementById(modalId);
  if (el) el.classList.remove('active');
}

/**
 * Event Listeners
 */
function setupEventListeners() {
  const bindF = (id, key) => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('change', () => {
        state.filters[key] = el.value;
        applyFiltersAndRender();
      });
    }
  };

  bindF('filter-fy', 'fiscalYear');
  bindF('filter-period', 'period');
  bindF('filter-group', 'group');
  bindF('filter-auditor', 'auditor');
  bindF('filter-department', 'department');

  const searchInput = document.getElementById('filter-search');
  if (searchInput) {
    searchInput.addEventListener('input', () => {
      state.filters.search = searchInput.value;
      applyFiltersAndRender();
    });
  }

  const loginForm = document.getElementById('login-form');
  if (loginForm) loginForm.addEventListener('submit', handleLoginSubmit);

  const editTrackForm = document.getElementById('form-edit-tracking');
  if (editTrackForm) editTrackForm.addEventListener('submit', handleEditTrackingFormSubmit);

  const addEditRoundForm = document.getElementById('form-add-edit-round');
  if (addEditRoundForm) addEditRoundForm.addEventListener('submit', handleAddEditRoundSubmit);

  document.querySelectorAll('.modal-overlay').forEach(o => {
    o.addEventListener('click', (e) => {
      if (e.target === o && state.user && o.id !== 'modal-login') {
        o.classList.remove('active');
      }
    });
  });
}

function showLoading(show) {
  const el = document.getElementById('global-loading');
  if (el) el.style.display = show ? 'flex' : 'none';
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

function setElText(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatDateForInput(dateStr) {
  if (!dateStr) return '';
  const parts = dateStr.toString().split(/[\/\-]/);
  if (parts.length === 3) {
    let day = parts[0].padStart(2, '0');
    let month = parts[1].padStart(2, '0');
    let year = parseInt(parts[2], 10);
    if (year > 2400) year -= 543;
    return `${year}-${month}-${day}`;
  }
  return dateStr;
}

function parseDateSafe(str) {
  if (!str) return null;
  const parts = str.toString().split(/[\/\-]/);
  if (parts.length === 3) {
    let day = parseInt(parts[0], 10);
    let month = parseInt(parts[1], 10) - 1;
    let year = parseInt(parts[2], 10);
    if (year > 2400) year -= 543;
    return new Date(year, month, day);
  }
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}

</script>
